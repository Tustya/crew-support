services:
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: crew
      POSTGRES_PASSWORD: crew
      POSTGRES_DB: crew_support
    volumes:
      - crew_support_pg:/var/lib/postgresql
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crew -d crew_support"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - crew

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://crew_app:crew_app@postgres:5432/crew_support
      MIGRATION_DATABASE_URL: postgres://crew_migrator:crew_migrator@postgres:5432/crew_support
      AUTH_MODE: password
      AUTH_PEPPER: dev-only-pepper-change-me-000000
      COOKIE_SECURE: "false"
      SOURCE_ADAPTER: sample
      MAIL_ADAPTER: disabled
      HOST: 0.0.0.0
      PORT: "8080"
      NODE_ENV: development
      SCHEDULER_ENABLED: "false"
      ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      TRUSTED_PROXY_CIDRS: 172.31.28.0/24
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - crew

  web:
    build:
      context: .
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
      - /var/log/nginx:mode=1777
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crew

volumes:
  crew_support_pg:

networks:
  crew:
    ipam:
      config:
        - subnet: 172.31.28.0/24
